<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel Personal - FGC Sant Josep</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .widget-panel {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }
        .header-widget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .logo-fgc {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            margin-right: 12px;
            font-size: 14px;
        }
        h3 {
            margin: 0;
            font-size: 18px;
            color: #f1f5f9;
        }
        .frame-container {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #475569;
            height: 520px;
            background: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .modo-tag {
            text-align: center;
            font-size: 11px;
            color: #4ade80;
            margin-top: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="widget-panel">
        <div class="header-widget">
            <div class="header-left">
                <span class="logo-fgc">FGC</span>
                <h3>Sant Josep - Panel Oficial</h3>
            </div>
        </div>
        
        <!-- Contenedor del visor web oficial sin bloqueos de red -->
        <div class="frame-container">
            <iframe src="https://fgc.cat"></iframe>
        </div>

        <div class="modo-tag">🌐 Visor oficial en tiempo real integrado de forma segura</div>
    </div>

</body>
</html>
