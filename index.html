<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Hospitalet</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 2.2rem; color: #38bdf8; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 1.5rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        h2 { font-size: 1.2rem; margin-bottom: 1rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; color: #38bdf8; }
        
        /* Enlaces */
        .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .link { display: flex; flex-direction: column; padding: 1rem; background: rgba(255,255,255,0.03); border: 1px solid #334155; border-radius: 8px; text-decoration: none; color: #f8fafc; transition: all 0.2s ease; }
        .link:hover { border-color: #38bdf8; background: rgba(56,189,248,0.08); transform: translateY(-2px); }
        .link b { font-size: 1rem; }
        .link span { font-size: 0.75rem; color: #94a3b8; margin-top: 0.3rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Autobús */
        .bus-subcard { background: rgba(255,255,255,0.02); border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-bottom: 0.8rem; }
        .bus-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: bold; color: #38bdf8; margin-bottom: 0.5rem; }
        .bus-list { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.5rem 0; }
        .bus-item { background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 4px; padding: 0.3rem 0.6rem; font-size: 0.8rem; font-weight: bold; }
        .bus-item.sig { border-color: #38bdf8; color: #38bdf8; }
        .bus-link { color: #38bdf8; font-size: 0.75rem; text-decoration: none; display: block; text-align: right; }

        /* Clima */
        .clima-bloque { margin-bottom: 1.2rem; }
        .clima-tit { font-size: 0.95rem; font-weight: bold; color: #38bdf8; margin-bottom: 0.3rem; }
        .clima-sub { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin: 0.4rem 0 0.3rem; }
        .grid-dias { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        .grid-horas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.4rem; }
        .clima-item { background: rgba(255,255,255,0.02); border: 1px solid #334155; border-radius: 6px; padding: 0.5rem 0.2rem; text-align: center; font-size: 0.75rem; }

        /* Horario Turnos */
        .box { background: rgba(56,189,248,0.05); border: 1px solid rgba(56,189,248,0.3); border-radius: 8px; padding: 1.2rem; text-align: center; margin-bottom: 1.2rem; }
        .shift-badge { font-size: 2.5rem; font-weight: 800; color: #38bdf8; margin: 0.2rem 0; }
        ul { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; font-size: 0.95rem; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0.8rem; background: rgba(255,255,255,0.02); border-radius: 6px; }
        .tag { font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
        .tag.mañana { background: #0284c7; color: #fff; }
        .tag.tarde { background: #d97706; color: #fff; }
        .tag.noche { background: #7c3aed; color: #fff; }
        .tag.noche-finde { background: #4c1d95; color: #e9d5ff; border: 1px solid #a855f7; }
        .tag.off { background: #475569; color: #94a3b8; }
    </style>
</head>
<body>

    <header>
        <h1>Panel Hospitalet</h1>
        <p style="color: #94a3b8; font-size: 0.9rem;">Acceso personal</p>
    </header>

    <div class="container">
        <!-- 1. Mis Enlaces -->
        <section class="card">
            <h2>Mis Enlaces</h2>
            <div class="links">

                    <b>Ir al trabajo</b>
                    <span>FGC: Sant Josep &rarr; Europa | Fira</span>
                </a>
