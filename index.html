<!-- Tarjeta del turno -->
<div class="card">
    <h2>Mi Turno Hoy</h2>
    <div style="font-size: 2.2rem; font-weight: bold; text-align: center; color: var(--accent);" id="turno-hoy">
        Consultando...
    </div>
    <div style="font-size: 0.9rem; color: var(--text-muted); text-align: center; margin-top: 0.5rem;" id="turno-fecha">
        --/--/----
    </div>
</div>

<script>
async function cargarTurno() {
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTYY-tJffbmNT8PC00CMisGJ8W0S4XSb6U0MnjD5BQbNkQE72ZhsxJwfnAObXWkaOLK2j6epc7Efy0D/pub?output=csv';
    
    try {
        const res = await fetch(csvUrl);
        if (!res.ok) throw new Error("No se pudo obtener el archivo");
        const texto = await res.text();
        
        // Separar filas
        const filas = texto.trim().split('\n');

        // Fecha de hoy en formato DD/MM/AAAA
        const hoy = new Date();
        const dia = String(hoy.getDate()).padStart(2, '0');
        const mes = String(hoy.getMonth() + 1).padStart(2, '0');
        const anio = hoy.getFullYear();
        const fechaHoy = `${dia}/${mes}/${anio}`;

        document.getElementById('turno-fecha').textContent = fechaHoy;

        // Tabla de equivalencias de turnos
        const mapaTurnos = {
            'M': 'Mañana',
            'T': 'Tarde',
            'Nn': 'Noche',
            'Nnw': 'Noche Fin de Semana'
        };

        let turnoCodigo = null;

        for (let i = 1; i < filas.length; i++) {
            // Limpiar comillas y espacios en blanco
            const cols = filas[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            
            // Columna 0: Fecha (DD/MM/AAAA) | Columna 2: Equipo E11
            if (cols[0] === fechaHoy) {
                turnoCodigo = cols[2];
                break;
            }
        }

        const elTurno = document.getElementById('turno-hoy');
        if (turnoCodigo && turnoCodigo !== '') {
            const desc = mapaTurnos[turnoCodigo] ? ` (${mapaTurnos[turnoCodigo]})` : '';
            elTurno.textContent = `${turnoCodigo}${desc}`;
        } else {
            elTurno.textContent = "Descanso / Libre";
            elTurno.style.color = "var(--text-muted)";
        }
    } catch (err) {
        document.getElementById('turno-hoy').textContent = "Error al cargar";
        console.error(err);
    }
}

cargarTurno();
</script>
