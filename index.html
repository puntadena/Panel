<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Personal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #334155;
            --badge-work: #0284c7;
            --badge-off: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2rem;
            color: var(--accent);
        }

        .dashboard-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 820px) {
            .dashboard-container {
                grid-template-columns: 360px 1fr;
            }
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Utilidades de tiempo */
        .time-box {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .clock {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .date {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
            text-transform: capitalize;
        }

        .weather-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .weather-temp {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .weather-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        /* Panel de Turnos / Horarios */
        .shift-today-box {
            text-align: center;
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .shift-badge {
            display: inline-block;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            margin: 0.25rem 0;
        }

        .shift-name {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .upcoming-shifts {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.88rem;
        }

        .upcoming-shifts li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.45rem 0.6rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .upcoming-shifts .tag {
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            background: var(--badge-work);
            color: #fff;
            font-size: 0.8rem;
        }

        .upcoming-shifts .tag.off {
            background: var(--badge-off);
            color: var(--text-muted);
        }

        /* Enlaces */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }

        .link-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .link-card:hover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.08);
            transform: translateY(-2px);
        }

        .link-card span.title {
            font-weight: 600;
            font-size: 1rem;
        }

        .link-card span.url {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        footer {
            margin-top: auto;
            padding-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>Panel de Control</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Acceso personal</p>
    </header>

    <main class="dashboard-container">
        <!-- Columna lateral: Tiempo y Horarios -->
        <div class="sidebar">
            <!-- Widget de Reloj & Clima -->
            <section class="card">
                <h2>Tiempo & Reloj</h2>
                
                <div class="time-box">
                    <div class="clock" id="live-clock">--:--:--</div>
                    <div class="date" id="live-date">Cargando fecha...</div>
                </div>

                <div class="weather-box">
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem;" id="weather-city">Ubicación local</div>
                    <div class="weather-temp" id="weather-temp">-- °C</div>
                    <div class="weather-desc" id="weather-status">Obteniendo previsión...</div>
                </div>
            </section>

            <!-- Widget de Cuadrante / Turno -->
            <section class="card">
                <h2>Horario Laboral <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">Equipo E11</span></h2>
                
                <div class="shift-today-box">
                    <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Turno de Hoy</div>
                    <div class="shift-badge" id="shift-today-code">--</div>
                    <div class="shift-name" id="shift-today-name">Consultando cuadrante...</div>
                </div>

                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem;">Próximos días:</div>
                <ul class="upcoming-shifts" id="upcoming-shifts-list">
                    <li><span>Cargando...</span></li>
                </ul>
            </section>
        </div>

        <!-- Columna principal: Enlaces y herramientas -->
        <section class="card">
            <h2>Mis Enlaces</h2>
            <div class="links-grid">
                <!-- Enlace para transporte al trabajo -->
                <a href="https://www.fgc.cat/es/buscador/?from_address=Sant+Josep&from_lat=41.360700975&from_lng=2.10991665&from_code=SP&to_address=Europa+%7C+Fira&to_lat=41.356558916&to_lng=2.124199344&to_code=EU&datetime_option=0&range_option=0&date=18-02-2025&time_from=13%3A09" target="_blank" class="link-card">
                    <span class="title">Ir al trabajo</span>
                    <span class="url">
