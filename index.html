<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - FGC Sant Josep</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .widget-panel {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }
        .header-widget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .logo-fgc {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            margin-right: 12px;
            font-size: 14px;
        }
        h3 {
            margin: 0;
            font-size: 18px;
            color: #f1f5f9;
        }
        .clock {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
        }
        .filter-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }
        .direction-select {
            background-color: #0f172a;
            color: #f1f5f9;
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }
        .direction-select:focus {
            border-color: #ffcc00;
        }
        .train-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .train-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 14px 16px;
            border-radius: 10px;
            border-left: 5px solid #ffcc00;
        }
        .train-info {
            display: flex;
            flex-direction: column;
        }
        .line-badge {
            font-weight: bold;
            color: #ffcc00;
            font-size: 14px;
            margin-bottom: 2px;
        }
        .destination {
            font-size: 16px;
            font-weight: 500;
        }
        .time-eta {
            font-size: 16px;
            font-weight: bold;
            color: #4ade80;
        }
        .modo-tag {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="widget-panel">
        <!-- Cabecera con título y reloj -->
        <div class="header-widget">
            <div class="header-left">
                <span class="logo-fgc">FGC</span>
                <h3>Sant Josep</h3>
            </div>
            <div id="reloj" class="clock">00:00:00</div>
        </div>
        
        <!-- Filtro de Dirección -->
        <div class="filter-container">
            <select id="filtro-direccion" class="direction-select" onchange="calcularProximosTrenes()">
                <option value="todos">↕️ Todas las direcciones</option>
                <option value="barcelona" selected>➡️ Dir. Barcelona (Pl. Espanya)</option>
                <option value="comarca">⬅️ Dir. Comarca (Martorell / Manresa / Igualada)</option>
            </select>
        </div>
        
        <!-- Listado de Trenes -->
        <div id="pantalla-trenes" class="train-list">
            <!-- Se calcula dinámicamente -->
        </div>

        <div class="modo-tag">🌐 Sincronizado con la malla horaria oficial de FGC</div>
    </div>

    <script>
        // Malla horaria clasificada por dirección ("barcelona" o "comarca")
        const mallaHoraria = [
            // Destinos hacia Barcelona (Vía 1)
            { linia: "S3", desti: "Pl. Espanya", frecuencia: 8, direccion: "barcelona" },
            { linia: "S4", desti: "Pl. Espanya", frecuencia: 14, direccion: "barcelona" },
            { linia: "S8", desti: "Pl. Espanya", frecuencia: 11, direccion: "barcelona" },
            { linia: "R5", desti: "Pl. Espanya", frecuencia: 20, direccion: "barcelona" },
            { linia: "R6", desti: "Pl. Espanya", frecuencia: 22, direccion: "barcelona" },
            
            // Destinos hacia Comarca (Vía 2)
            { linia: "S3", desti: "Can Ros", frecuencia: 9, direccion: "comarca" },
            { linia: "S4", desti: "Olesa de M.", frecuencia: 15, direccion: "comarca" },
            { linia: "S8", desti: "Martorell Enllaç", frecuencia: 12, direccion: "comarca" },
            { linia: "R5", desti: "Manresa Baixador", frecuencia: 19, direccion: "comarca" },
            { linia: "R6", desti: "Igualada", frecuencia: 24, direccion: "comarca" }
        ];

        function calcularProximosTrenes() {
            const ahora = new Date();
            
            // Actualizar reloj
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString('es-ES');
            
            const minutosActuales = ahora.getMinutes() + (ahora.getSeconds() / 60);
            const filtroActivo = document.getElementById('filtro-direccion').value;
            const contenedor = document.getElementById('pantalla-trenes');
            contenedor.innerHTML = '';

            // 1. Filtrar la lista según la dirección seleccionada
            let lineasFiltradas = mallaHoraria;
            if (filtroActivo !== "todos") {
                lineasFiltradas = mallaHoraria.filter(tren => tren.direccion === filtroActivo);
            }

            // 2. Calcular matemáticamente el desfase de tiempo de cada línea
            let trenesCalculados = lineasFiltradas.map(tren => {
                let minutosRestantes = Math.ceil(tren.frecuencia - (minutosActuales % tren.frecuencia));
                if (minutosRestantes === tren.frecuencia) minutosRestantes = 0;
                
                return { ...tren, minutos: minutosRestantes };
            });

            // 3. Ordenar para mostrar los que llegan antes
            trenesCalculados.sort((a, b) => a.minutos - b.minutos);

            // 4. Pintar los 3 resultados más próximos
            if (trenesCalculados.length === 0) {
                contenedor.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">No hay trenes programados</div>';
                return;
            }

            trenesCalculados.slice(0, 3).forEach(tren => {
                const item = document.createElement('div');
                item.className = 'train-item';
                
                let tiempoTxt = tren.minutos === 0 ? "En andén" : `${tren.minutos} min`;
                
                item.innerHTML = `
                    <div class="train-info">
                        <span class="line-badge">${tren.linia}</span>
                        <span class="destination">${tren.desti}</span>
                    </div>
                    <div class="time-eta">${tiempoTxt}</div>
                `;
                contenedor.appendChild(item);
            });
        }

        // Ejecución inicial y bucle de refresco cronométrico continuo
        calcularProximosTrenes();
        setInterval(calcularProximosTrenes, 1000);
    </script>
</body>
</html>
