<script>
        // 1. RELOJ Y FECHA (Completamente independiente)
        function updateClock() {
            try {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const clockEl = document.getElementById('live-clock');
                const dateEl = document.getElementById('live-date');
                
                if (clockEl) clockEl.textContent = `${hours}:${minutes}:${seconds}`;
                if (dateEl) {
                    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    dateEl.textContent = now.toLocaleDateString('es-ES', options);
                }
            } catch (err) {
                console.error("Error en reloj:", err);
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. METEOROLOGÍA
        function decodeWmo(code) {
            if (code === 0) return "Cielo despejado";
            if (code >= 1 && code <= 3) return "Parcialmente nublado";
            if (code >= 45 && code <= 48) return "Niebla";
            if (code >= 51 && code <= 67) return "Lluvia ligera";
            if (code >= 71 && code <= 77) return "Nieve";
            if (code >= 80 && code <= 82) return "Chubascos";
            if (code >= 95) return "Tormenta";
            return "Nublado";
        }

        async function fetchWeather(lat = 41.3596, lon = 2.0997, cityLabel = "L'Hospitalet / BCN") {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("Error en respuesta meteorológica");
                const data = await res.json();
                
                const cityEl = document.getElementById('weather-city');
                const tempEl = document.getElementById('weather-temp');
                const statEl = document.getElementById('weather-status');

                if (cityEl) cityEl.textContent = cityLabel;
                if (tempEl) tempEl.textContent = `${Math.round(data.current_weather.temperature)} °C`;
                if (statEl) statEl.textContent = decodeWmo(data.current_weather.weathercode);
            } catch (err) {
                console.warn("Fallo clima:", err);
                const statEl = document.getElementById('weather-status');
                if (statEl) statEl.textContent = "Sin datos meteorológicos";
            }
        }

        // Carga meteorológica con posición por defecto si no hay permisos
        fetchWeather();

        // 3. CONSULTA DE TURNOS (Detección automática de comas o punto y coma)
        const csvScheduleUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTYY-tJffbmNT8PC00CMisGJ8W0S4XSb6U0MnjD5BQbNkQE72ZhsxJwfnAObXWkaOLK2j6epc7Efy0D/pub?output=csv';

        const shiftNames = {
            'M': 'Mañana',
            'T': 'Tarde',
            'Nn': 'Noche',
            'Nnw': 'Noche Fin de Semana'
        };

        function formatDate(d) {
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        async function loadSchedule() {
            const todayCodeEl = document.getElementById('shift-today-code');
            const todayNameEl = document.getElementById('shift-today-name');
            const listEl = document.getElementById('upcoming-shifts-list');

            try {
                // Añadimos parámetro temporal para evitar problemas de caché del navegador
                const response = await fetch(`${csvScheduleUrl}&_t=${Date.now()}`);
                if (!response.ok) throw new Error("HTTP error " + response.status);
                
                const text = await response.text();
                const lines = text.trim().split(/\r?\n/);

                if (lines.length < 2) throw new Error("CSV vacío o sin contenido");

                // Detectar si el delimitador es coma o punto y coma
                const delimiter = lines[0].includes(';') ? ';' : ',';

                const shiftsMap = {};

                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(delimiter).map(c => c.trim().replace(/^"|"$/g, ''));
                    if (cols[0]) {
                        // Normalizamos la fecha (por si viene con ceros o espacios)
                        const fechaLimpia = cols[0].trim();
                        // Columna 2: Equipo E11
                        shiftsMap[fechaLimpia] = (cols[2] || '').trim();
                    }
                }

                const today = new Date();
                const todayStr = formatDate(today);
                const todayCode = shiftsMap[todayStr] || '';

                if (todayCode) {
                    todayCodeEl.textContent = todayCode;
                    todayNameEl.textContent = shiftNames[todayCode] || todayCode;
                    todayCodeEl.style.color = "var(--accent)";
                } else {
                    todayCodeEl.textContent = "LIBRE";
                    todayCodeEl.style.color = "var(--text-muted)";
                    todayNameEl.textContent = "Día de descanso";
                }

                // Generar los 4 días siguientes
                if (listEl) {
                    listEl.innerHTML = '';
                    for (let offset = 1; offset <= 4; offset++) {
                        const nextDate = new Date();
                        nextDate.setDate(today.getDate() + offset);
                        const nextStr = formatDate(nextDate);
                        const dayLabel = nextDate.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'numeric' });
                        const code = shiftsMap[nextStr] || '';

                        const li = document.createElement('li');
                        const isOff = !code;
                        li.innerHTML = `
                            <span style="text-transform: capitalize;">${dayLabel}</span>
                            <span class="tag ${isOff ? 'off' : ''}">${isOff ? 'Libre' : (shiftNames[code] ? code + ' · ' + shiftNames[code] : code)}</span>
                        `;
                        listEl.appendChild(li);
                    }
                }

            } catch (err) {
                console.error("Error cargando cuadrante:", err);
                if (todayCodeEl) todayCodeEl.textContent = "--";
                if (todayNameEl) todayNameEl.textContent = "No se pudo sincronizar";
                if (listEl) {
                    listEl.innerHTML = '<li><span style="color:var(--text-muted);">Sin conexión con Google Sheets</span></li>';
                }
            }
        }

        loadSchedule();
    </script>
