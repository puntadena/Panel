<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Personal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent);
        }

        .dashboard-container {
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .top-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .top-row {
                grid-template-columns: 360px 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Reloj y Fecha */
        .time-box {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .clock {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
        }

        .date {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 0.3rem;
            text-transform: capitalize;
        }

        .weather-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 1.2rem;
            text-align: center;
        }

        .weather-temp {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .weather-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        /* Enlaces */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        .link-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .link-card:hover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.08);
            transform: translateY(-2px);
        }

        .link-card span.title {
            font-weight: 600;
            font-size: 1rem;
        }

        .link-card span.url {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Contenedor del Cuadrante (iframe de Google Sheets) */
        .sheet-container {
            width: 100%;
            height: 480px;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            border: 1px solid var(--border);
        }

        .sheet-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            margin-top: auto;
            padding-top: 2.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>Panel de Control</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Acceso personal</p>
    </header>

    <main class="dashboard-container">
        <!-- Fila Superior: Tiempo y Enlaces -->
        <div class="top-row">
            <!-- Tarjeta 1: Reloj & Clima -->
            <section class="card">
                <h2>Tiempo & Reloj</h2>
                <div class="time-box">
                    <div class="clock" id="live-clock">--:--:--</div>
                    <div class="date" id="live-date">Cargando fecha...</div>
                </div>
                <div class="weather-box">
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem;">L'Hospitalet / BCN</div>
                    <div class="weather-temp" id="weather-temp">-- °C</div>
                    <div class="weather-desc" id="weather-status">Consultando previsión...</div>
                </div>
            </section>

            <!-- Tarjeta 2: Mis Enlaces -->
            <section class="card">
                <h2>Mis Enlaces</h2>
                <div class="links-grid">
                    <!-- Enlace 1: Ida al trabajo -->
                    <a href="https://www.fgc.cat/es/buscador/?from_address=Sant+Josep&amp;from_code=SP&amp;to_address=Europa+%7C+Fira&amp;to_code=EU" target="_blank" rel="noopener noreferrer" class="link-card">
                        <span class="title">Ir al trabajo</span>
                        <span class="url">FGC: Sant Josep &rarr; Europa | Fira</span>
                    </a>

                    <!-- Enlace 2: Vuelta del trabajo -->
                    <a href="https://www.fgc.cat/es/buscador/?from_address=Europa+%7C+Fira&amp;from_lat=41.356558916&amp;from_lng=2.124199344&amp;from_code=EU&amp;to_address=Sant+Josep&amp;to_lat=41.360700975&amp;to_lng=2.10991665&amp;to_code=SP&amp;datetime_option=0&amp;range_option=0&amp;date=29-10-2026&amp;time_from=10%3A48" target="_blank" rel="noopener noreferrer" class="link-card">
                        <span class="title">Vuelta del trabajo</span>
                        <span class="url">FGC: Europa | Fira &rarr; Sant Josep</span>
                    </a>
                </div>
            </section>
        </div>
